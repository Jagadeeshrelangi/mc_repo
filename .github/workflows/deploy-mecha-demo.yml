name: Deploy Mecha Connect demo

on:
  push:
    branches: [main]
    paths:
      - "demo/index.html.gz.b64"
      - ".github/workflows/deploy-mecha-demo.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Prepare static demo
        run: |
          mkdir -p site
          base64 --decode demo/index.html.gz.b64 | gzip --decompress > site/index.html
          test -s site/index.html
          grep -q "Mecha Connect — Interactive Demo" site/index.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
