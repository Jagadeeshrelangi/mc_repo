<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mecha Connect — UI Blueprint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<style>
:root{
  --bp:#4F46E5;--bp-l:#818CF8;--bp-d:#3730A3;
  --bs:#F97316;--ba:#06B6D4;--gs:#10B981;--gw:#F59E0B;--ge:#EF4444;--gi:#3B82F6;--gp:#7C3AED;
  --grad:linear-gradient(135deg,#4F46E5,#7C3AED,#06B6D4);
  --bg1:#FFFFFF;--bg2:#F8FAFC;--bg3:#F1F5F9;--bgc:#FFFFFF;
  --bgi:#F1F5F9;--bgh:#F1F5F9;--bga:#EEF2FF;--bgo:rgba(0,0,0,.45);
  --t1:#0F172A;--t2:#475569;--t3:#94A3B8;--ti:#FFF;
  --bd:#E2E8F0;--bl:#F1F5F9;
  --ss:0 1px 2px rgba(0,0,0,.04);--sm:0 4px 12px rgba(0,0,0,.06);
  --sl:0 8px 30px rgba(0,0,0,.08);--sx:0 20px 60px rgba(0,0,0,.1);
  --rs:8px;--rm:12px;--rl:16px;--rxl:24px;--rf:9999px;
  --ts:.25s ease;--sw:264px;--hh:60px;
  --ff:'Inter',system-ui,sans-serif;--ff2:'Space Grotesk',sans-serif;
}
[data-theme="dark"]{
  --bg1:#0F172A;--bg2:#111827;--bg3:#1E293B;--bgc:#1E293B;
  --bgi:#1E293B;--bgh:#1E293B;--bga:#1E1B4B;--bgo:rgba(0,0,0,.65);
  --t1:#F1F5F9;--t2:#94A3B8;--t3:#64748B;
  --bd:#1E293B;--bl:#334155;--bp:#818CF8;
  --ss:0 1px 2px rgba(0,0,0,.3);--sm:0 4px 12px rgba(0,0,0,.4);
  --sl:0 8px 30px rgba(0,0,0,.5);--sx:0 20px 60px rgba(0,0,0,.6);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--ff);background:var(--bg2);color:var(--t1);overflow:hidden;height:100vh;transition:background var(--ts),color var(--ts)}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px}
.material-symbols-rounded{font-variation-settings:'FILL'1,'wght'400,'GRAD'0,'opsz'24;vertical-align:middle;font-size:20px}
img{-webkit-user-drag:none}
input,textarea,select,button{font-family:inherit}

/* ── Layout ── */
.app{display:flex;height:100vh}
.sidebar{width:var(--sw);min-width:var(--sw);background:var(--bgc);border-right:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden;z-index:100}
.sb-hd{padding:18px 20px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px}
.sb-logo{width:34px;height:34px;border-radius:var(--rm);background:var(--grad);display:flex;align-items:center;justify-content:center;color:#FFF;font-weight:800;font-size:15px;font-family:var(--ff2)}
.sb-t{font-family:var(--ff2);font-weight:700;font-size:15px}
.sb-st{font-size:9px;color:var(--t3);font-weight:600;letter-spacing:.5px;text-transform:uppercase}
.sb-nav{flex:1;overflow-y:auto;padding:6px 8px}
.nsg-t{padding:10px 12px 4px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--t3)}
.ni{display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:var(--rs);cursor:pointer;transition:all .12s;font-size:11.5px;font-weight:500;color:var(--t2);position:relative;user-select:none}
.ni:hover{background:var(--bgh);color:var(--t1)}
.ni.a{background:var(--bga);color:var(--bp);font-weight:600}
.ni.a::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:16px;background:var(--bp);border-radius:0 3px 3px 0}
.ni .material-symbols-rounded{font-size:17px;opacity:.6}.ni.a .material-symbols-rounded{opacity:1}
.ni .nb{margin-left:auto;font-size:8px;background:var(--bp);color:#FFF;padding:1px 5px;border-radius:var(--rf);font-weight:700}
.sb-ft{padding:12px;border-top:1px solid var(--bd)}
.th-btn{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:var(--rs);cursor:pointer;font-size:11.5px;font-weight:500;color:var(--t2);border:none;background:none;width:100%;text-align:left;transition:all .12s}
.th-btn:hover{background:var(--bgh)}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.m-hd{height:var(--hh);min-height:var(--hh);padding:0 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bd);background:var(--bg1);z-index:50}
.m-hd h1{font-family:var(--ff2);font-size:16px;font-weight:700}
.m-hd-r{display:flex;gap:6px;align-items:center}
.hb{width:34px;height:34px;border-radius:var(--rs);border:1px solid var(--bd);background:var(--bg1);color:var(--t2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s}
.hb:hover{background:var(--bgh);color:var(--t1)}.hb .material-symbols-rounded{font-size:18px}
.m-ct{flex:1;overflow-y:auto;padding:24px}

/* ── Screens ── */
.sp{display:none;animation:fi .3s ease}.sp.a{display:block}
@keyframes fi{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 20px;border-radius:var(--rm);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .12s;white-space:nowrap;outline:none}
.btn:active{transform:scale(.97)}
.btn-p{background:var(--grad);color:#FFF;box-shadow:0 4px 15px rgba(79,70,229,.25)}.btn-p:hover{box-shadow:0 6px 20px rgba(79,70,229,.35);transform:translateY(-1px)}
.btn-s{background:var(--bg3);color:var(--t1)}.btn-s:hover{background:var(--bgh)}
.btn-o{background:transparent;border:1.5px solid var(--bd);color:var(--t1)}.btn-o:hover{border-color:var(--bp)}
.btn-d{background:var(--ge);color:#FFF}
.btn-sm{padding:7px 14px;font-size:11px}.btn-lg{padding:14px 28px;font-size:15px}.btn-bl{width:100%}

/* ── Form ── */
.fg{margin-bottom:14px}.fl{display:block;font-size:11px;font-weight:600;color:var(--t2);margin-bottom:5px}
.fi{width:100%;padding:10px 14px;border:1.5px solid var(--bd);border-radius:var(--rm);background:var(--bgi);color:var(--t1);font-family:inherit;font-size:13px;transition:all .15s;outline:none}
.fi:focus{border-color:var(--bp);background:var(--bg1);box-shadow:0 0 0 3px rgba(79,70,229,.1)}.fi::placeholder{color:var(--t3)}
.fii{position:relative}.fii .fi{padding-left:40px}.fii .m-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--t3);font-size:18px}
.otp-g{display:flex;gap:10px;justify-content:center}
.otp-i{width:44px;height:50px;border:2px solid var(--bd);border-radius:var(--rm);text-align:center;font-size:18px;font-weight:700;background:var(--bgi);color:var(--t1);font-family:var(--ff2);outline:none;transition:all .15s}
.otp-i:focus{border-color:var(--bp);box-shadow:0 0 0 3px rgba(79,70,229,.15)}

/* ── Cards / Chips / Badges ── */
.card{background:var(--bgc);border:1px solid var(--bd);border-radius:var(--rl);padding:20px;transition:all .2s}
.card-e{box-shadow:var(--sm);border:none}
.card-ck{cursor:pointer}.card-ck:hover{transform:translateY(-2px);box-shadow:var(--sl)}
.card-gr{background:var(--grad);color:#FFF;border:none}
.chip{display:inline-flex;align-items:center;gap:4px;padding:5px 12px;border-radius:var(--rf);font-size:10px;font-weight:600;border:1px solid var(--bd);background:var(--bg3);color:var(--t2);cursor:pointer;transition:all .12s;user-select:none}
.chip.a{background:var(--bp);color:#FFF;border-color:var(--bp)}.chip .material-symbols-rounded{font-size:13px}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;padding:0 5px;border-radius:var(--rf);font-size:8px;font-weight:700;background:var(--bp);color:#FFF}
.badge-s{background:var(--gs)}.badge-w{background:var(--gw);color:#000}.badge-e{background:var(--ge)}

/* ── Utilities ── */
.tabs{display:flex;gap:3px;background:var(--bg3);border-radius:var(--rm);padding:3px}
.tab{flex:1;padding:8px;border-radius:var(--rs);font-size:11px;font-weight:600;color:var(--t2);cursor:pointer;text-align:center;border:none;background:none;font-family:inherit;transition:all .12s}
.tab.a{background:var(--bgc);color:var(--bp);box-shadow:var(--ss)}
.sw{position:relative;width:40px;height:22px;cursor:pointer;display:inline-block}.sw input{display:none}
.sw-sl{position:absolute;inset:0;background:var(--bd);border-radius:11px;transition:.3s}
.sw-sl::before{content:'';position:absolute;left:2px;top:2px;width:18px;height:18px;border-radius:50%;background:#FFF;transition:.3s;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.sw input:checked+.sw-sl{background:var(--bp)}.sw input:checked+.sw-sl::before{transform:translateX(18px)}
.divider{height:1px;background:var(--bd);margin:10px 0}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#FFF;flex-shrink:0}
.av-s{width:28px;height:28px;font-size:10px}.av-m{width:36px;height:36px;font-size:13px}.av-l{width:48px;height:48px;font-size:16px}.av-xl{width:72px;height:72px;font-size:24px}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.flex{display:flex}.fc{flex-direction:column}.fcl{align-items:center}.fb{justify-content:space-between}.fw{flex-wrap:wrap}.fg2{gap:2px}.g4{gap:4px}.g6{gap:6px}.g8{gap:8px}.g10{gap:10px}.g12{gap:12px}.g16{gap:16px}
.mt4{margin-top:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}
.mb4{margin-bottom:4px}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}
.tc{text-align:center}.wf{width:100%}
.pbar{height:5px;background:var(--bg3);border-radius:3px;overflow:hidden}.pfill{height:100%;border-radius:3px;background:var(--grad);transition:width .5s ease}
.stat{padding:14px;border-radius:var(--rl);background:var(--bgc);border:1px solid var(--bd)}
.stat-v{font-family:var(--ff2);font-size:22px;font-weight:800}.stat-l{font-size:10px;color:var(--t2);font-weight:500;margin-top:2px}

/* ── Phone Mockup ── */
.phone{width:300px;max-width:100%;background:var(--bgc);border-radius:32px;border:5px solid var(--t1);overflow:hidden;box-shadow:var(--sx);margin:0 auto;position:relative}
.phone-nt{height:22px;background:var(--t1);border-radius:0 0 16px 16px;display:flex;align-items:center;justify-content:center}
.phone-ntb{width:60px;height:4px;background:var(--bg3);border-radius:2px}
.phone-c{height:480px;overflow-y:auto;position:relative}
.phone-nv{display:flex;border-top:1px solid var(--bd);background:var(--bg1);padding:4px 0 6px;position:sticky;bottom:0}
.pni{flex:1;display:flex;flex-direction:column;align-items:center;gap:0;padding:4px 2px;color:var(--t3);font-size:8px;font-weight:600;cursor:pointer;transition:color .15s}
.pni.a{color:var(--bp)}.pni .material-symbols-rounded{font-size:18px}

/* ── Map ── */
.map-p{width:100%;height:180px;border-radius:var(--rl);background:linear-gradient(135deg,#E0F2FE,#DBEAFE,#EDE9FE);position:relative;overflow:hidden}
.map-g{position:absolute;inset:0;background-image:linear-gradient(var(--bl) 1px,transparent 1px),linear-gradient(90deg,var(--bl) 1px,transparent 1px);background-size:36px 36px;opacity:.4}
.map-pin{position:absolute;width:28px;height:28px;background:var(--bp);border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(79,70,229,.3)}
.map-pin .material-symbols-rounded{transform:rotate(45deg);color:#FFF;font-size:14px}
.map-pin2{position:absolute;width:24px;height:24px;background:var(--ge);border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(239,68,68,.3)}
.map-pin2 .material-symbols-rounded{transform:rotate(45deg);color:#FFF;font-size:12px}

/* ── Overlays ── */
.bts{position:fixed;inset:0;background:var(--bgo);z-index:1000;display:none;align-items:flex-end;justify-content:center}.bts.show{display:flex}
.bts-b{background:var(--bgc);border-radius:var(--rxl) var(--rxl) 0 0;width:100%;max-width:560px;max-height:80vh;overflow-y:auto;padding:20px;animation:su .3s ease}
@keyframes su{from{transform:translateY(100%)}to{transform:none}}
.bts-h{width:36px;height:4px;background:var(--bd);border-radius:2px;margin:0 auto 16px}
.dlg{position:fixed;inset:0;background:var(--bgo);z-index:1000;display:none;align-items:center;justify-content:center}.dlg.show{display:flex}
.dlg-b{background:var(--bgc);border-radius:var(--rxl);padding:28px;width:90%;max-width:360px;box-shadow:var(--sx);animation:dl .25s ease;text-align:center}
@keyframes dl{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.dlg-i{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.dlg-i.s{background:#ECFDF5;color:var(--gs)}.dlg-i.e{background:#FEF2F2;color:var(--ge)}
.snk{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--t1);color:var(--bg1);padding:12px 20px;border-radius:var(--rm);font-size:12px;font-weight:500;box-shadow:var(--sx);z-index:2000;transition:transform .3s ease;display:flex;align-items:center;gap:8px}
.snk.show{transform:translateX(-50%) translateY(0)}

/* ── Sidebar mobile ── */
.sov{position:fixed;inset:0;background:var(--bgo);z-index:90;display:none}.sov.show{display:block}
.mob-btn{display:none}
.stars{display:flex;gap:2px}.star{color:#D1D5DB;font-size:16px}.star.f{color:#F59E0B}

/* ── Anims ── */
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes sosPulse{0%,100%{box-shadow:0 0 0 10px rgba(239,68,68,.15)}50%{box-shadow:0 0 0 20px rgba(239,68,68,.08)}}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skel{background:linear-gradient(90deg,var(--bg3) 25%,var(--bgh) 50%,var(--bg3) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:var(--rs)}

@media(max-width:800px){.sidebar{position:fixed;left:-280px;height:100vh;transition:left .25s}.sidebar.open{left:0}.mob-btn{display:flex!important}.sov{z-index:150}.m-ct{padding:16px}}
</style>
</head>
<body>
<div class="app">
<div class="sov" id="sov" onclick="toggleSB()"></div>
<aside class="sidebar" id="sb">
<div class="sb-hd"><div class="sb-logo">M</div><div><div class="sb-t">Mecha Connect</div><div class="sb-st">UI Blueprint v1.0</div></div></div>
<nav class="sb-nav" id="sNav"></nav>
<div class="sb-ft"><button class="th-btn" onclick="toggleTheme()"><span class="material-symbols-rounded" id="thI">dark_mode</span><span id="thL">Dark Mode</span></button></div>
</aside>
<main class="main">
<header class="m-hd">
<div class="flex" style="align-items:center;gap:10px"><button class="hb mob-btn" onclick="toggleSB()"><span class="material-symbols-rounded">menu</span></button><h1 id="scrT">Splash</h1></div>
<div class="m-hd-r"><button class="hb" onclick="snk('Search coming soon')"><span class="material-symbols-rounded">search</span></button><button class="hb" style="position:relative" onclick="bsShow('notif')"><span class="material-symbols-rounded">notifications</span><span class="badge" style="position:absolute;top:-3px;right:-3px;font-size:7px;min-width:12px;height:12px;padding:0 2px">3</span></button></div>
</header>
<div class="m-ct" id="mCt"></div>
</main>
</div>
<div class="bts" id="bts" onclick="if(event.target===this)bsHide()"><div class="bts-b"><div class="bts-h"></div><div id="btsC"></div></div></div>
<div class="dlg" id="dlg" onclick="if(event.target===this)dlgHide()"><div class="dlg-b" id="dlgC"></div></div>
<div class="snk" id="snk"></div>
<script>// ══════════════════════════════════════════

const screens = [

{id:'onboard2',cat:'Auth',title:'Onboarding â€” Mechanic',icon:'build',desc:'Step 2/3: Instant Mechanic Help. Connect with nearby mechanics.',phone:()=>`
<div style="height:100%;display:flex;flex-direction:column;padding:20px;background:var(--bgc)">
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center">
    <div style="width:120px;height:120px;border-radius:50%;background:linear-gradient(135deg,#EEF2FF,#DBEAFE);display:flex;align-items:center;justify-content:center;margin-bottom:28px;box-shadow:0 0 60px rgba(79,70,229,.12)">

// ── OTP Auto-focus ──
document.addEventListener('input', e => {
  if (e.target.classList.contains('otp-i')) {
    const val = e.target.value;
    if (val.length === 1) {
      const next = e.target.nextElementSibling;
      if (next && next.classList.contains('otp-i')) next.focus();
    }
  }
});
document.addEventListener('keydown', e => {
  if (e.target.classList.contains('otp-i') && e.key === 'Backspace' && !e.target.value) {
    const prev = e.target.previousElementSibling;
    if (prev && prev.classList.contains('otp-i')) prev.focus();
  }
});
